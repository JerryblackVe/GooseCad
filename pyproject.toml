[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "goosecad-professional"
version = "0.1.0a1"
requires-python = ">=3.13,<3.14"
dependencies = ["cadquery-ocp==7.9.3.1.1", "numpy==2.3.5", "scipy==1.17.0"]
[project.optional-dependencies]
ui = ["vtk==9.6.2", "PySide6==6.9.3"]

[tool.setuptools.packages.find]
where = ["src"]
