name: Kernel smoke tests
on:
  push:
    branches: ['feature/**', develop, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          architecture: x64
      - run: python -m pip install -r dependencies/requirements-core.txt
      - run: python -m pip install --no-deps .
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests -v
      - run: python experiments/topology_history.py
      - run: python benchmarks/kernel_bench.py ci-benchmarks.csv
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-benchmarks-${{ matrix.os }}
          path: ci-benchmarks.csv
