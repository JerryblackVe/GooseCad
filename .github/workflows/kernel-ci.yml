name: Kernel smoke tests
on:
  push:
    branches: ['feature/**', develop, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          architecture: x64
      - run: python -m pip install -r dependencies/requirements-core.txt
      - run: python -m pip install --no-deps .
      - run: cmake -S experiments/abi -B build/abi -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/abi --config Release
      - run: ctest --test-dir build/abi -C Release --output-on-failure
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests -v
      - run: python experiments/topology_history.py
      - run: python benchmarks/kernel_bench.py ci-benchmarks.csv
      - run: python benchmarks/dag_bench.py ci-dag-benchmarks.csv --repetitions 10
      - run: python benchmarks/document_bench.py ci-document-benchmarks.csv --repetitions 10
      - run: python benchmarks/native_bench.py ci-native-benchmarks.csv --repetitions 5
      - run: python benchmarks/solver_bench.py ci-solver-benchmarks.csv --repetitions 10
      - run: python benchmarks/sweep_bench.py ci-sweep-benchmarks.csv --repetitions 5
      - run: python benchmarks/native_sketch_bench.py ci-native-sketch-benchmarks.csv --repetitions 3
      - run: python benchmarks/disk_lock_bench.py ci-disk-lock-benchmarks.csv --repetitions 10
      - run: python benchmarks/curve_bench.py ci-curve-benchmarks.csv --repetitions 5
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-benchmarks-${{ matrix.os }}
          path: |
            ci-benchmarks.csv
            ci-dag-benchmarks.csv
            ci-document-benchmarks.csv
            ci-native-benchmarks.csv
            ci-solver-benchmarks.csv
            ci-sweep-benchmarks.csv
            ci-native-sketch-benchmarks.csv
            ci-disk-lock-benchmarks.csv
            ci-curve-benchmarks.csv
