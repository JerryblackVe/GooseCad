name: Qt VTK compatibility probe
on:
  push:
    branches: ['feature/**']
    paths: ['experiments/qt_probe.py', '.github/workflows/qt-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        qt: ['6.9.3', '6.11.3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          architecture: x64
      - name: Install Linux graphics runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libxrender1 libxi6 libsm6 libice6 libfontconfig1 libdbus-1-3 xvfb xauth
      - run: python -m pip install -r dependencies/requirements-core.txt "PySide6==${{ matrix.qt }}"
      - run: python -m pip install --no-deps .
      - name: Inspect Qt XCB dependencies
        if: runner.os == 'Linux'
        run: |
          plugin=$(python -c 'import PySide6,pathlib; print(pathlib.Path(PySide6.__file__).parent / "Qt/plugins/platforms/libqxcb.so")')
          ldd "$plugin"
          if ldd "$plugin" | grep 'not found'; then exit 1; fi
      - if: runner.os == 'Linux'
        env:
          QT_DEBUG_PLUGINS: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python experiments/qt_probe.py
      - if: runner.os == 'Windows'
        run: python experiments/qt_probe.py
