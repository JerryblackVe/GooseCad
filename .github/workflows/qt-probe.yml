name: Qt VTK compatibility probe
on:
  push:
    branches: ['feature/**']
    paths: ['experiments/qt_probe.py', '.github/workflows/qt-probe.yml', 'src/goosecad/ui/**', 'src/goosecad/view/**', 'src/goosecad/document/**', 'tests/test_qt_workspace.py', 'benchmarks/qt_workspace_bench.py', 'experiments/windows_mesa_runner.py', 'scripts/install-mesa-ci.ps1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        qt: ['6.9.3', '6.11.3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          architecture: x64
      - name: Install Linux graphics runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libxrender1 libxi6 libsm6 libice6 libfontconfig1 libdbus-1-3 xvfb xauth
      - run: python -m pip install -r dependencies/requirements-core.txt "PySide6==${{ matrix.qt }}"
      - run: python -m pip install --no-deps .
      - name: Inspect Qt XCB dependencies
        if: runner.os == 'Linux'
        run: |
          plugin=$(python -c 'import PySide6,pathlib; print(pathlib.Path(PySide6.__file__).parent / "Qt/plugins/platforms/libqxcb.so")')
          ldd "$plugin"
          if ldd "$plugin" | grep 'not found'; then exit 1; fi
      - if: runner.os == 'Linux'
        env:
          QT_DEBUG_PLUGINS: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python experiments/qt_probe.py
      - name: Install pinned Mesa software OpenGL for Windows CI only
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-mesa-ci.ps1
      - name: Windows Qt/VTK WGL via Mesa LLVMpipe (not hardware validation)
        if: runner.os == 'Windows'
        run: python experiments/windows_mesa_runner.py experiments/qt_probe.py
      - name: Windows Qt workspace integration via Mesa LLVMpipe
        if: runner.os == 'Windows'
        env:
          GOOSECAD_TEST_QT: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/windows_mesa_runner.py -m unittest discover -s tests -p test_qt_workspace.py -v
      - name: Qt workspace integration (Linux virtual display)
        if: runner.os == 'Linux'
        env:
          GOOSECAD_TEST_QT: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: xvfb-run -a python -m unittest discover -s tests -p test_qt_workspace.py -v
      - name: Qt workspace latency benchmark (Linux virtual display)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: xvfb-run -a python benchmarks/qt_workspace_bench.py qt-workspace.csv
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: qt-workspace-${{ matrix.qt }}
          path: qt-workspace.csv
