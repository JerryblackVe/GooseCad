name: Windows experimental packaging (no binary publication)
on:
  push:
    branches: ['feature/**']
    paths:
      - '.github/workflows/windows-package.yml'
      - 'packaging/**'
      - 'scripts/test-windows-installer.ps1'
      - 'dependencies/requirements-freeze-tools.txt'
      - 'src/goosecad/ui/self_test.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-test:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          architecture: x64
      - name: Install pinned runtime and build dependencies
        run: |
          python -m pip install --only-binary=:all: -r dependencies/requirements-core.txt PySide6==6.9.3 altgraph==0.17.5 pefile==2024.8.26 pywin32-ctypes==0.2.3 setuptools==80.9.0
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r dependencies/requirements-freeze-tools.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Build and test ephemeral installer
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Retain textual audit metadata only
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-audit
          path: |
            packaging-dependency-inventory.json
            packaging-bundle-inventory.json
            packaging-freeze-warnings.txt
